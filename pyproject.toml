[project]
name = "guia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Limongi-lab", email = "limongigames3@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cssselect>=1.6.0",
    "fastapi>=0.143.1",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
guia = "guia:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
